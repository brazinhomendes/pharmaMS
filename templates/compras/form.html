{% extends 'base.html' %}
{% block title %}Novo Pedido - pharmaMS{% endblock %}
{% block page_title %}Novo Pedido de Compra{% endblock %}
{% block content %}

<div class="card-dashboard p-4">
    <form method="post">
        {% csrf_token %}
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label">Fornecedor</label>
                <select name="fornecedor" class="form-select" required>
                    <option value="">Selecione...</option>
                    {% for f in fornecedores %}
                    <option value="{{ f.id }}">{{ f.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Data Previsão</label>
                <input type="date" name="data_previsao" class="form-control">
            </div>
            <div class="col-md-12">
                <label class="form-label">Observações</label>
                <textarea name="observacoes" class="form-control" rows="2"></textarea>
            </div>
        </div>

        <h6 class="fw-semibold mb-3"><i class="bi bi-cart me-1"></i> Itens do Pedido</h6>
        <table class="table table-bordered" id="itens-table">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Unit. (R$)</th>
                    <th style="width:50px"></th>
                </tr>
            </thead>
            <tbody>
                <tr class="item-row">
                    <td>
                        <select name="produto" class="form-select" required>
                            <option value="">Selecione...</option>
                            {% for p in produtos %}
                            <option value="{{ p.id }}">{{ p.nome }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td><input type="number" name="quantidade" class="form-control" min="1" required></td>
                    <td><input type="number" step="0.01" name="preco_unitario" class="form-control" min="0" required></td>
                    <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
                </tr>
            </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary mb-4" onclick="addItem()">
            <i class="bi bi-plus-lg"></i> Adicionar Item
        </button>

        <div class="mt-3">
            <button type="submit" class="btn btn-pharma">Criar Pedido</button>
            <a href="{% url 'compras:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
function addItem() {
    const row = document.querySelector('.item-row').cloneNode(true);
    row.querySelectorAll('input, select').forEach(el => el.value = '');
    document.querySelector('#itens-table tbody').appendChild(row);
}
</script>
{% endblock %}
