{% extends 'base.html' %}
{% block title %}Nova Receita - pharmaMS{% endblock %}
{% block page_title %}Nova Receita{% endblock %}
{% block content %}
<div class="card-dashboard p-4">
    <form method="post">
        {% csrf_token %}
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label">Nº Receita</label>
                <input type="text" name="numero_receita" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Paciente</label>
                <input type="text" name="paciente_nome" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">CPF</label>
                <input type="text" name="paciente_cpf" class="form-control" placeholder="000.000.000-00">
            </div>
            <div class="col-md-4">
                <label class="form-label">Profissional</label>
                <select name="profissional" class="form-select" required>
                    <option value="">Selecione...</option>
                    {% for p in profissionais %}
                    <option value="{{ p.pk }}">{{ p.nome }} - {{ p.conselho }} {{ p.numero_conselho }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Data Emissão</label>
                <input type="date" name="data_emissao" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Data Validade</label>
                <input type="date" name="data_validade" class="form-control" required>
            </div>
            <div class="col-12">
                <label class="form-label">Observações</label>
                <textarea name="observacoes" class="form-control" rows="2"></textarea>
            </div>
        </div>
        <h6 class="fw-semibold mb-3">Itens da Receita</h6>
        <div id="itens-receita">
            <div class="row g-3 mb-2 item-receita">
                <div class="col-md-5">
                    <select name="medicamento" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for m in medicamentos %}
                        <option value="{{ m.pk }}">{{ m.produto.nome }} - {{ m.get_tipo_receita_display }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" name="quantidade" class="form-control" placeholder="Qtd" value="1" required>
                </div>
                <div class="col-md-5">
                    <input type="text" name="posologia" class="form-control" placeholder="Posologia">
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-4" onclick="addItem()"><i class="bi bi-plus-lg"></i> Adicionar Item</button>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
            <a href="{% url 'sngpc:receitas' %}" class="btn btn-outline-secondary ms-2">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
function addItem() {
    const div = document.createElement('div');
    div.className = 'row g-3 mb-2 item-receita';
    div.innerHTML = `
        <div class="col-md-5">
            <select name="medicamento" class="form-select">
                <option value="">Selecione...</option>
                {% for m in medicamentos %}
                <option value="{{ m.pk }}">{{ m.produto.nome }} - {{ m.get_tipo_receita_display }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <input type="number" name="quantidade" class="form-control" placeholder="Qtd" value="1">
        </div>
        <div class="col-md-4">
            <input type="text" name="posologia" class="form-control" placeholder="Posologia">
        </div>
        <div class="col-md-1 d-flex align-items-center">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.item-receita').remove()"><i class="bi bi-trash"></i></button>
        </div>
    `;
    document.getElementById('itens-receita').appendChild(div);
}
</script>
{% endblock %}
