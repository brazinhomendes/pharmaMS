{% extends 'base.html' %}
{% load static %}

{% block title %}Nova Operadora PBM{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Nova Operadora PBM</h1>
</div>

<div class="card">
    <div class="card-header">
        <h5><i class="bi bi-building"></i> Criar Operadora</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label" for="id_nome">Nome</label>
                <input type="text" name="nome" id="id_nome"
                       class="form-control" placeholder="Ex: OperadoraXYZ" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="id_tipo">Tipo</label>
                <select name="tipo" id="id_tipo" class="form-select" required>
                    <option value="">Selecione o tipo...</option>
                    {% for value, label in OPERADORAS_TIPOS %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Criar Operadora
                </button>
                <a href="{% url 'pbm:operadora_list' %}" class="btn btn-ghost">
                    <i class="bi bi-arrow-left"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
