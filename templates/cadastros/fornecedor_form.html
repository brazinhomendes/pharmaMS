{% extends 'base.html' %}
{% block title %}{% if fornecedor %}Editar{% else %}Novo{% endif %} Fornecedor - pharmaMS{% endblock %}
{% block page_title %}{% if fornecedor %}Editar{% else %}Novo{% endif %} Fornecedor{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome *</label>
                    <input type="text" name="nome" class="form-control" required value="{{ fornecedor.nome|default:'' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">CNPJ</label>
                    <input type="text" name="cnpj" class="form-control" value="{{ fornecedor.cnpj|default:'' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Inscrição Estadual</label>
                    <input type="text" name="ie" class="form-control" value="{{ fornecedor.ie|default:'' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Endereço</label>
                    <input type="text" name="endereco" class="form-control" value="{{ fornecedor.endereco|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Bairro</label>
                    <input type="text" name="bairro" class="form-control" value="{{ fornecedor.bairro|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cidade</label>
                    <input type="text" name="cidade" class="form-control" value="{{ fornecedor.cidade|default:'' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">UF</label>
                    <input type="text" name="uf" class="form-control" maxlength="2" value="{{ fornecedor.uf|default:'' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">CEP</label>
                    <input type="text" name="cep" class="form-control" value="{{ fornecedor.cep|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" name="telefone" class="form-control" value="{{ fornecedor.telefone|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Celular</label>
                    <input type="text" name="celular" class="form-control" value="{{ fornecedor.celular|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" value="{{ fornecedor.email|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nome do Contato</label>
                    <input type="text" name="contato_nome" class="form-control" value="{{ fornecedor.contato_nome|default:'' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Observações</label>
                    <textarea name="observacoes" class="form-control" rows="3">{{ fornecedor.observacoes|default:'' }}</textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{% url 'cadastros:fornecedores' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
