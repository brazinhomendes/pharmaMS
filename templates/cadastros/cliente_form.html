{% extends 'base.html' %}
{% block title %}{% if cliente %}Editar{% else %}Novo{% endif %} Cliente - pharmaMS{% endblock %}
{% block page_title %}{% if cliente %}Editar{% else %}Novo{% endif %} Cliente{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome *</label>
                    <input type="text" name="nome" class="form-control" required value="{{ cliente.nome|default:'' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">CPF/CNPJ</label>
                    <input type="text" name="cpf_cnpj" class="form-control" value="{{ cliente.cpf_cnpj|default:'' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">RG</label>
                    <input type="text" name="rg" class="form-control" value="{{ cliente.rg|default:'' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Data de Nascimento</label>
                    <input type="date" name="data_nascimento" class="form-control" value="{{ cliente.data_nascimento|date:'Y-m-d'|default:'' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Sexo</label>
                    <select name="sexo" class="form-select">
                        <option value="">---</option>
                        <option value="M" {% if cliente.sexo == 'M' %}selected{% endif %}>Masculino</option>
                        <option value="F" {% if cliente.sexo == 'F' %}selected{% endif %}>Feminino</option>
                        <option value="O" {% if cliente.sexo == 'O' %}selected{% endif %}>Outro</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Endereço</label>
                    <input type="text" name="endereco" class="form-control" value="{{ cliente.endereco|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Bairro</label>
                    <input type="text" name="bairro" class="form-control" value="{{ cliente.bairro|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cidade</label>
                    <input type="text" name="cidade" class="form-control" value="{{ cliente.cidade|default:'' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">UF</label>
                    <input type="text" name="uf" class="form-control" maxlength="2" value="{{ cliente.uf|default:'' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">CEP</label>
                    <input type="text" name="cep" class="form-control" value="{{ cliente.cep|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" name="telefone" class="form-control" value="{{ cliente.telefone|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Celular</label>
                    <input type="text" name="celular" class="form-control" value="{{ cliente.celular|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" value="{{ cliente.email|default:'' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Observações</label>
                    <textarea name="observacoes" class="form-control" rows="3">{{ cliente.observacoes|default:'' }}</textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{% url 'cadastros:clientes' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
