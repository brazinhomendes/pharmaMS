{% extends 'base.html' %}
{% block title %}Perfil CRM - pharmaMS{% endblock %}
{% block content %}
<div class="page-header"><div><h5><i class="bi bi-person-badge text-info me-2"></i>Perfil CRM - {{ cliente.nome }}</h5></div></div>
<div class="row"><div class="col-lg-6">
    <div class="card"><div class="card-body">
        <form method="post">{% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Data de Aniversario</label><input type="date" name="aniversario" class="form-control" value="{{ perfil_crm.aniversario|date:'Y-m-d'|default:'' }}"></div>
                <div class="col-12"><label class="form-label">Observacoes</label><textarea name="observacoes" class="form-control" rows="4">{{ perfil_crm.observacoes }}</textarea></div>
            </div>
            <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Salvar</button><a href="{% url 'cadastros:clientes' %}" class="btn btn-ghost">Voltar</a></div>
        </form>
    </div></div>
</div></div>
{% endblock %}
