{% extends 'base.html' %}
{% block title %}Novo Lote - pharmaMS{% endblock %}
{% block page_title %}Novo Lote{% endblock %}
{% block content %}

<div class="card-dashboard p-4">
    <form method="post">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Produto</label>
                <select name="produto" class="form-select" required>
                    <option value="">Selecione...</option>
                    {% for p in produtos %}
                    <option value="{{ p.id }}">{{ p.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Código do Lote</label>
                <input type="text" name="codigo_lote" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Data Fabricação</label>
                <input type="date" name="data_fabricacao" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Data Validade</label>
                <input type="date" name="data_validade" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Quantidade</label>
                <input type="number" name="quantidade" class="form-control" value="0" min="0">
            </div>
            <div class="col-md-4">
                <label class="form-label">Preço Custo (R$)</label>
                <input type="number" step="0.01" name="preco_custo" class="form-control" value="0">
            </div>
            <div class="col-md-4">
                <label class="form-label">Fornecedor</label>
                <select name="fornecedor" class="form-select">
                    <option value="">Selecione...</option>
                    {% for f in fornecedores %}
                    <option value="{{ f.id }}">{{ f.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nota Fiscal</label>
                <input type="text" name="nota_fiscal" class="form-control" maxlength="50">
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-pharma">Salvar</button>
            <a href="{% url 'estoque:lotes' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
